# @package _global_

name: 3D

defaults:
  - /data: 3D
  - /eval_data: 3D

window: 1 #by default

score:
  _target_: utils.score.ConditionedScoreUNet
  size: 64
  add_noise: True
  embedding: 32

net:
  _target_: utils.unet.UNet
  hidden_channels: [48, 96, 192, 384, 768]
  hidden_blocks: [3, 3, 3, 3, 3]
  kernel_size: 3
  activation: 'SiLU'
  spatial: ${data.spatial}
  padding_mode: 'circular'
  embedding: 32

optim:
  lr: 2e-4
  weight_decay: 1e-5

# training:
epochs: 1000
batch_size: 32
scheduler_name: 'cosine'
model_type: "noise"
ema_decay: 0.995
log_loss_per_level: True
